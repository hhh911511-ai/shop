<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>متجر إلكتروني</title>
<style>
body {font-family: sans-serif; background:#f4f4f4; margin:0; padding:20px;}
h1{text-align:center;}
.products{display:flex; flex-wrap:wrap; gap:20px; justify-content:center;}
.card{background:#fff; padding:15px; width:250px; border-radius:10px; box-shadow:0 0 5px rgba(0,0,0,0.1);}
.card img{width:100%; border-radius:10px;}
.price{color:#008000; font-weight:bold; margin:10px 0;}
button{width:100%; padding:10px; border:none; border-radius:8px; background:#000; color:#fff;}
</style>
</head>
<body>
<h1>متجر متعدد المنتجات</h1>
<div class="products">
    <div class="card">
        <img src="https://via.placeholder.com/250x200" />
        <h3>ساعة يد</h3>
        <p class="price">120 ريال</p>
        <button>إضافة للسلة</button>
    </div>
    <div class="card">
        <img src="https://via.placeholder.com/250x200" />
        <h3>سماعات بلوتوث</h3>
        <p class="price">90 ريال</p>
        <button>إضافة للسلة</button>
    </div>
    <div class="card">
        <img src="https://via.placeholder.com/250x200" />
        <h3>حذاء رياضي</h3>
        <p class="price">150 ريال</p>
        <button>إضافة للسلة</button>
    </div>
</div>
</body>
</html>
